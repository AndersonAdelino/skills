name: test

on: [push, pull_request]

jobs:
  autoteste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # no pip install on purpose: the self-tests only touch the stdlib
      # heuristics, so they stay fast and can't break on a dependency.
      # Add a line here for every new skill that ships a script.
      # invariantes do repo antes dos autotestes: frontmatter que nao
      # parseia faz a skill sumir da lista sem erro nenhum
      - run: python scripts/validar-skills.py --autoteste
      - run: python scripts/validar-skills.py
      - run: python skills/cut-silence/scripts/remove-fillers.py --autoteste
      - run: python skills/cpanel-deploy/scripts/deploy-cpanel.py --autoteste
      - run: python skills/local-site-lift/scripts/imagens.py --autoteste
      - run: python skills/local-site-lift/scripts/negocio.py --autoteste
      - run: python skills/local-site-lift/scripts/aferir.py --autoteste
      - run: python skills/thread-carousel/scripts/build-carousel.py --autoteste
